<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KOF'97 Web</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* 不只是纯黑：宽屏时画布两侧会留一条，用同色系的暗渐变当"画框"，
           读起来是留白而不是黑边（手台就摆在这两条里，不挡画面） */
        background: radial-gradient(120% 90% at 50% 45%, #10151f 0%, #070a10 55%, #04060a 100%);
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #safe-probe {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    #rotate-hint {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #05070a;
      color: #ffd166;
      font: 600 18px/1.6 system-ui, sans-serif;
      letter-spacing: 1px;
      text-align: center;
      padding: 24px;
      cursor: pointer;
      z-index: 30;
      -webkit-tap-highlight-color: transparent;
    }
    /* 手机图标 + 旋转箭头，纯 CSS 画，不依赖图片 */
    #rotate-hint .phone {
      width: 46px;
      height: 76px;
      border: 3px solid #ffd166;
      border-radius: 8px;
      animation: rotateHint 2.4s ease-in-out infinite;
    }
    @keyframes rotateHint {
      0%, 45% { transform: rotate(0deg); }
      70%, 100% { transform: rotate(-90deg); }
    }
    #rotate-hint .sub {
      font: 500 13px/1.5 system-ui, sans-serif;
      color: #8fa2b8;
      letter-spacing: 0;
    }
    #rotate-hint .cta {
      padding: 10px 22px;
      border: 2px solid #ff5b3d;
      border-radius: 24px;
      color: #fff;
      background: rgba(255, 91, 61, 0.22);
      font-size: 16px;
    }

    #rotate-hint.show {
      display: flex;
    }

    #screen {
        display: block;
        position: absolute;
        left: 0;
        top: 0;
        image-rendering: pixelated;
      }

      /* ---------------- 屏上按键（触屏 / 鼠标） ---------------- */
      #controls {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        font-family: system-ui, -apple-system, 'PingFang SC', sans-serif;
      }
      #controls .pad,
      #controls .atk,
      #controls .bar {
        position: absolute;
        pointer-events: auto;
      }
      #controls .btn {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.32);
        border-radius: 10px;
        background: rgba(18, 22, 30, 0.42);
        color: #e8f0ff;
        font-size: 14px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #controls .btn.pressed {
        background: rgba(120, 180, 255, 0.6);
        border-color: rgba(190, 225, 255, 0.9);
      }
      /* 摇杆：尺寸与位置由 JS 按屏幕短边比例设置（见 src/ui/pad-layout.ts） */
      #controls .stick {
        position: absolute;
        pointer-events: auto;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.26);
        background: radial-gradient(circle at 50% 45%, rgba(40, 56, 82, 0.42), rgba(10, 14, 20, 0.5));
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #controls .stick.pressed {
        border-color: rgba(190, 225, 255, 0.85);
        background: radial-gradient(circle at 50% 45%, rgba(60, 90, 130, 0.5), rgba(10, 14, 20, 0.55));
      }
      #controls .knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44%;
        height: 44%;
        margin: -22% 0 0 -22%;
        border-radius: 50%;
        background: rgba(200, 226, 255, 0.34);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 0 12px rgba(120, 180, 255, 0.35);
      }
      /* 攻击键容器不占位，四颗键各自绝对定位到菱形顶点 */
      #controls .atk {
        position: static;
        pointer-events: none;
      }
      #controls .atk .btn {
        position: absolute;
        pointer-events: auto;
        border-radius: 50%;
        padding: 0;
        font-weight: 600;
      }
      #controls .atk .kA,
      #controls .atk .kC {
        background: rgba(150, 60, 60, 0.45);
        border-color: rgba(255, 170, 160, 0.5);
      }
      #controls .atk .kB,
      #controls .atk .kD {
        background: rgba(60, 90, 150, 0.42);
        border-color: rgba(170, 200, 255, 0.5);
      }
      /* 底部功能条：位置与大小同样来自 padLayout */
      #controls .bar {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        pointer-events: auto;
        overflow: hidden;
      }
      #controls .bar .btn {
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
        border-radius: 8px;
        padding: 0 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: rgba(18, 22, 30, 0.55);
      }
    </style>
  </head>
  <body>
    <!-- 安全区探针：读 env(safe-area-inset-*) 的真实值（CSS 里设 padding，JS 读 computedStyle） -->
  <div id="safe-probe" aria-hidden="true"></div>
  <!-- 竖屏提示：手机竖着拿时没法玩，直接盖一层提示 -->
  <div id="rotate-hint" role="button" aria-label="进入横屏全屏">
    <div class="phone"></div>
    <div>请横屏游玩</div>
    <div class="cta" id="rotate-cta">点击进入横屏全屏</div>
    <div class="sub" id="rotate-sub">进入后可全屏游戏；若没反应，请手动把手机横过来</div>
  </div>
  <canvas id="screen"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
