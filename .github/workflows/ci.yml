name: CI

# 一个 workflow 干完所有事：校验 → 构建 → 发布。
#
# 为什么合并（原来是 ci.yml + deploy.yml 两个）：两个 workflow 各自跑一次
# `npm ci` + `npm run build`，等于白花一顿。合并后 job 内**共享 node_modules**，
# 只装一次依赖、只构建一次，构建产物直接交给 Pages。
on:
  push:
    branches: [main]
  pull_request:
  # 允许手动重发一次（改了 Pages 设置之后用得上）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# workflow 级：同分支连推时取消上一次（省额度、避免旧结果盖新结果）
# deploy job 另有自己的并发组——部署不能被中途打断，否则线上会出现半个站点
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # vite 7 要求 Node 20.19+ / 22.12+；锁 22 既满足要求又不会因为主版本漂移突然坏掉
  NODE_VERSION: '22'

jobs:
  build:
    name: 校验 · 构建
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 校验三步分开放：失败时一眼看出是类型错、用例挂、还是素材没同步
      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      # 读仓库里已有的 public/（图集 / 头像 / 舞台的数量、尺寸、动画名、比例），不用重新出图
      - name: 素材自检
        run: npm run art:check

      # npm run build = tsc --noEmit && vite build
      - name: 构建
        run: npm run build

      # 只有要发布时才准备 Pages 产物（PR 上不需要，省一次上传）
      - name: 配置 Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布
    # 只在 main 上发布；PR 只校验
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 部署串行且不打断：中途取消会让线上出现半个站点
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
